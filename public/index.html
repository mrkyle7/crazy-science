<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crazy Science</title>
  <meta name="description" content="Crazy Science: run wild 3D experiments together, live, on Cheetah Moon Games. For scientists aged 5 to 105.">
  <!-- Icons and installing: see "Icons and installing" in ADDING_A_GAME.md. -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0b26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Crazy Science">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/jsm/" } }
  </script>
</head>
<body>
  <canvas id="lab" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="home" href="https://cheetahmoongames.com/" aria-label="More games from Cheetah Moon Games">&larr; Cheetah Moon Games</a>
    <span class="bar-right">
      <button class="icon-btn" id="mute" type="button" aria-label="Sound on or off" aria-pressed="false">🔊</button>
      <span class="account" id="account" aria-live="polite"></span>
    </span>
  </header>

  <!-- Before joining a lab -->
  <main class="screen" id="home">
    <div class="card home-card">
      <h1 class="logo"><span>Crazy</span> <span>Science</span></h1>
      <p class="tagline">Wild experiments, played live with family and friends. Guess what happens, then watch it for real!</p>

      <label class="field" id="name-field" hidden>
        <span>Your name</span>
        <input id="name" type="text" maxlength="16" autocomplete="nickname" placeholder="Scientist name" enterkeyhint="done">
      </label>

      <fieldset class="levels" id="home-levels">
        <legend>Pick your level. Everyone gets their own questions.</legend>
      </fieldset>

      <button class="btn big" id="create" type="button">🧪 Start a new lab</button>
      <form class="join-row" id="join-form">
        <label class="sr-only" for="code">Lab code</label>
        <input id="code" type="text" maxlength="4" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE">
        <button class="btn alt" type="submit">Join a lab</button>
      </form>
      <p class="error" id="home-error" role="alert"></p>

      <footer class="foot">
        <a class="bmc" href="https://buymeacoffee.com/mrkyle7" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 7h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V7Zm13 1.5h1a3 3 0 0 1 0 6h-1.3c.2-.5.3-1 .3-1.5h1a1.5 1.5 0 0 0 0-3h-1V8.5ZM3 19.5h15V21H3v-1.5Z"/></svg>
          Buy me a coffee
        </a>
      </footer>
    </div>
  </main>

  <!-- Waiting in a lab for the game to start -->
  <section class="screen" id="room" hidden>
    <div class="card room-card">
      <div class="room-code">
        <span>Lab code</span>
        <strong id="room-code">····</strong>
        <button class="btn small alt" id="invite" type="button">Invite</button>
      </div>
      <ul class="roster" id="roster" aria-label="Scientists in this lab"></ul>
      <fieldset class="levels compact" id="room-levels"><legend>Your level</legend></fieldset>
      <div class="looks" id="looks" role="radiogroup" aria-label="Your colour"></div>
      <button class="btn big" id="start" type="button" hidden>🚀 Start the experiments!</button>
      <p class="waiting" id="room-waiting" hidden></p>
      <button class="link" id="leave" type="button">Leave this lab</button>
    </div>
  </section>

  <!-- Playing -->
  <section id="game" hidden>
    <div class="hud">
      <div class="hud-row">
        <span class="pill" id="round-pill"></span>
        <span class="pill fuel" title="Rocket fuel: every right answer adds some">🚀 <span class="fuel-track"><span class="fuel-fill" id="fuel-fill"></span></span> <span id="fuel-text">0%</span></span>
      </div>
      <div class="timer" id="timer" hidden><span id="timer-fill"></span></div>
      <ul class="chips" id="chips" aria-label="Scores"></ul>
    </div>

    <div class="banner" id="banner" hidden>
      <div class="banner-icon" id="banner-icon"></div>
      <div class="banner-sub" id="banner-sub"></div>
      <div class="banner-title" id="banner-title"></div>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="result" id="result" hidden></div>
      <div class="prompt-row">
        <p class="prompt" id="prompt"></p>
        <button class="icon-btn" id="read" type="button" aria-label="Read the question aloud again">🗣️</button>
      </div>
      <div class="options" id="options"></div>
      <p class="fact" id="fact" hidden></p>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>
  </section>

  <!-- The rocket has flown -->
  <section class="screen" id="final" hidden>
    <div class="card final-card">
      <h2 id="final-title"></h2>
      <p id="final-team"></p>
      <ol class="podium" id="podium"></ol>
      <button class="btn big" id="again" type="button" hidden>🧪 Play again</button>
      <p class="waiting" id="final-waiting" hidden></p>
      <button class="link" id="final-leave" type="button">Leave this lab</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    // Every game shares one sign-in, at cheetahmoongames.com: fetch('/api/me')
    // in /js/main.js shows who's signed in, or a link to sign in.
    // Lets players install the game on their phone or desktop.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
